#:schema https://developers.openai.com/codex/config-schema.json

# Project-scoped Codex configuration.
# The CLI and VS Code Codex extension share project config layers.

[agents]
enabled = true
max_concurrent_threads_per_session = 4

[agents.product_manager]
description = "First-stop product intake lead for concise triage, decision gates, and minimum-role routing."
config_file = "agents/product-manager.toml"

[agents.product_owner]
description = "Product owner for testable requirements, acceptance criteria, edge cases, and traceability."
config_file = "agents/product-owner.toml"

[agents.product_researcher]
description = "Read-only researcher for market, competitor, standards, and technology evidence."
config_file = "agents/product-researcher.toml"

[agents.ux_ui_designer]
description = "UX/UI specialist for flows, states, design-system consistency, responsiveness, and accessibility."
config_file = "agents/ux-ui-designer.toml"

[agents.system_architect]
description = "System architect for boundaries, interfaces, data flow, integrations, reliability, and ADRs."
config_file = "agents/system-architect.toml"

[agents.db_architect]
description = "Database architect for models, migrations, integrity, queries, transactions, and recovery."
config_file = "agents/db-architect.toml"

[agents.security_engineer]
description = "Read-only security reviewer for trust boundaries, authorization, secrets, data, and abuse cases."
config_file = "agents/security-engineer.toml"

[agents.backend_engineer]
description = "Backend implementer for APIs, domain logic, integrations, jobs, reliability, and tests."
config_file = "agents/backend-engineer.toml"

[agents.frontend_engineer]
description = "Frontend implementer for accessible UI behavior, state, performance, and tests."
config_file = "agents/frontend-engineer.toml"

[agents.android_developer]
description = "Native Android implementer for Kotlin/Java, Compose/XML, lifecycle, platform APIs, and tests."
config_file = "agents/android-developer.toml"

[agents.ios_developer]
description = "Native iOS implementer for Swift/Objective-C, SwiftUI/UIKit, lifecycle, platform APIs, and tests."
config_file = "agents/ios-developer.toml"

[agents.qa_engineer]
description = "Independent QA specialist for risk-based plans, runtime verification, regression tests, and evidence."
config_file = "agents/qa-engineer.toml"

[agents.code_reviewer]
description = "Independent read-only reviewer for correctness, regressions, architecture, security, and test quality."
config_file = "agents/code-reviewer.toml"

[agents.devops_sre]
description = "DevOps/SRE specialist for CI/CD, runtime, deployment, observability, reliability, and rollback."
config_file = "agents/devops-sre.toml"

[agents.documentation_engineer]
description = "Documentation specialist who reconciles durable product and engineering docs with shipped behavior."
config_file = "agents/documentation-engineer.toml"

[features]
hooks = true
